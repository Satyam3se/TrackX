<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121829" />
      <stop offset="100%" stop-color="#0a0d18" />
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="plateShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Background Road / Surveillance View -->
  <rect width="640" height="400" fill="url(#bg)" />
  <path d="M 0 320 L 640 320 L 640 400 L 0 400 Z" fill="#1e293b" opacity="0.6" />
  <line x1="80" y1="360" x2="200" y2="360" stroke="#f59e0b" stroke-width="4" stroke-dasharray="20 15" />
  <line x1="280" y1="360" x2="400" y2="360" stroke="#f59e0b" stroke-width="4" stroke-dasharray="20 15" />
  <line x1="480" y1="360" x2="600" y2="360" stroke="#f59e0b" stroke-width="4" stroke-dasharray="20 15" />

  <!-- CCTV OSD Overlay -->
  <text x="25" y="35" fill="#00e5ff" font-family="monospace" font-size="12" font-weight="bold">CAM-042 [RING ROAD / ITO JUNCTION] · 30 FPS · 1080P</text>
  <text x="25" y="55" fill="#94a3b8" font-family="monospace" font-size="11">2026-09-22 08:33:02 IST · SPEED EST: 46 KM/H</text>

  <!-- Vehicle Silhouette (Maruti Suzuki Dzire Sedan - Rear View) -->
  <ellipse cx="320" cy="330" rx="210" ry="25" fill="#000000" opacity="0.45" />

  <!-- Car Body Main -->
  <path d="M 170 290 C 160 270 160 210 180 180 C 200 150 230 135 270 130 L 370 130 C 410 135 440 150 460 180 C 480 210 480 270 470 290 C 460 305 440 310 320 310 C 200 310 180 305 170 290 Z" fill="url(#carBody)" stroke="#64748b" stroke-width="2" />

  <!-- Rear Windshield -->
  <path d="M 215 175 C 230 145 260 140 320 140 C 380 140 410 145 425 175 C 430 185 425 195 410 200 L 230 200 C 215 195 210 185 215 175 Z" fill="url(#window)" stroke="#334155" stroke-width="2" />

  <!-- Tail Lights -->
  <path d="M 175 220 C 185 215 220 220 235 235 L 225 250 C 205 250 180 245 175 235 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.5" />
  <path d="M 465 220 C 455 215 420 220 405 235 L 415 250 C 435 250 460 245 465 235 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.5" />

  <!-- Bumper & Trunk Cutout -->
  <rect x="235" y="245" width="170" height="50" rx="6" fill="#0f172a" opacity="0.3" />

  <!-- LICENSE PLATE (BBOX TARGET) -->
  <!-- Target Box Bounds: x=245, y=250, width=150, height=40 -->
  <g id="licensePlate">
    <rect x="245" y="250" width="150" height="40" rx="4" fill="url(#plateShine)" stroke="#0f172a" stroke-width="2" />
    <!-- Blue IND strip on left of HSRP -->
    <rect x="245" y="250" width="16" height="40" rx="3" fill="#1d4ed8" />
    <circle cx="253" cy="260" r="3" fill="#fbbf24" />
    <text x="253" y="278" fill="#ffffff" font-family="sans-serif" font-size="7" font-weight="900" text-anchor="middle">IND</text>

    <!-- License Plate Characters -->
    <text x="325" y="278" fill="#0f172a" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="900" letter-spacing="3" text-anchor="middle">DL 3C AF 9021</text>
  </g>
</svg>
