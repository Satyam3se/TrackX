<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="vanBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bgVan)" />
  <path d="M 0 310 L 640 310 L 640 400 L 0 400 Z" fill="#0f172a" />

  <text x="25" y="35" fill="#eab308" font-family="monospace" font-size="12" font-weight="bold">CAM-501 [GT KARNAL ROAD] · FREIGHT CORRIDOR</text>
  <text x="25" y="55" fill="#94a3b8" font-family="monospace" font-size="11">COMMERCIAL CLASS: LCV CARRIER · REPEAT PERIMETER LOOPING</text>

  <!-- Box Van Body -->
  <rect x="160" y="90" width="320" height="210" rx="8" fill="url(#vanBody)" stroke="#475569" stroke-width="2" />
  <line x1="320" y1="90" x2="320" y2="300" stroke="#64748b" stroke-width="2" />
  <rect x="180" y="110" width="120" height="60" rx="4" fill="#1e293b" opacity="0.6" />
  <rect x="340" y="110" width="120" height="60" rx="4" fill="#1e293b" opacity="0.6" />

  <!-- Heavy Bumper -->
  <rect x="150" y="295" width="340" height="24" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="2" />

  <!-- YELLOW COMMERCIAL LICENSE PLATE -->
  <!-- Target Box Bounds: x=245, y=245, width=150, height=42 -->
  <g id="licensePlate">
    <rect x="245" y="245" width="150" height="42" rx="4" fill="#facc15" stroke="#a16207" stroke-width="2" />
    <rect x="245" y="245" width="16" height="42" rx="3" fill="#1d4ed8" />
    <text x="253" y="271" fill="#ffffff" font-family="sans-serif" font-size="7" font-weight="900" text-anchor="middle">IND</text>
    <text x="328" y="273" fill="#111827" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="900" letter-spacing="3" text-anchor="middle">UP 14 AB 1234</text>
  </g>
</svg>
